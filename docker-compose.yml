services:
  app:
    build: .
    ports:
      - "8000:8000"   # reachable on the LAN at http://<this-pc-ip>:8000 — do NOT port-forward (no login)
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Singapore}   # warranty "expiring"/"expired" uses local dates
    restart: unless-stopped
